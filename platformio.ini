; ESP32 / ESP32-S3 Wi-Fi Bridge + DNS Filter (+ FSD Mock on ESP32-S3)
; Existing esp32-wifi envs target Arduino 2.x (ESP-IDF 4.4).
; Waveshare ESP32-S3 Wi-Fi envs use espressif32@8.0.0 (Arduino 3.3.12 / IDF 5.5.5)
; so mbedTLS 3.6 can negotiate TLS 1.3 as well as TLS 1.2.
[env]
platform = espressif32@6.12.0

; ── 标准 ESP32 Wi-Fi 桥接 + DNS 过滤 ──────────────────────────────────────────
; 手机热点 → ESP32 STA → ESP32 AP → 车机
[env:esp32-wifi]
board = esp32dev
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
build_flags =
    -I include
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DCORE_DEBUG_LEVEL=0
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
extra_scripts = pre:compress_html.py, post:merge_firmware.py

[env:esp32-wifi-debug]
board = esp32dev
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
build_flags =
    -I include
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DDEBUG_MODE
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
extra_scripts = pre:compress_html.py, post:merge_firmware.py

; ── Waveshare ESP32-S3 Wi-Fi 桥接 + DNS 过滤 + FSD 下发（TLS 1.3） ────────────
; 手机热点 → ESP32-S3 STA → ESP32-S3 AP → 车机
[env:esp32s3-waveshare-wifi]
; Arduino 3.3.12 / ESP-IDF 5.5.5: mbedTLS 3.6 adds TLS 1.3 while keeping TLS 1.2.
; The esp32-wifi envs stay on the pinned 6.12.0 / IDF 4.4 toolchain.
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
build_flags =
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DCORE_DEBUG_LEVEL=0
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.tls13.defaults" -DCMAKE_PROJECT_tesla-fsd-controller_INCLUDE="idf_o2_compat.cmake"
extra_scripts = pre:compress_html.py, post:merge_firmware.py

[env:esp32s3-waveshare-wifi-debug]
; Arduino 3.3.12 / ESP-IDF 5.5.5: mbedTLS 3.6 adds TLS 1.3 while keeping TLS 1.2.
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
build_flags =
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DDEBUG_MODE
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.tls13.defaults" -DCMAKE_PROJECT_tesla-fsd-controller_INCLUDE="idf_o2_compat.cmake"
extra_scripts = pre:compress_html.py, post:merge_firmware.py
