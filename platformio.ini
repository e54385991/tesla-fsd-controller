; ESP32 / ESP32-S3 Wi-Fi Bridge + DNS Filter (+ FSD Mock on ESP32-S3)
; All envs target pioarduino/platform-espressif32@61.04.00
; (Arduino 4.0.0 / ESP-IDF 6.1.1 / GCC 15.2 / mbedTLS 4.0 TLS 1.2+1.3 / C23+C++26).
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip

; ── 标准 ESP32 Wi-Fi 桥接 + DNS 过滤 ──────────────────────────────────────────
; 手机热点 → ESP32 STA → ESP32 AP → 车机
[env:esp32-wifi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board = esp32dev
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
    https://github.com/ESP32Async/AsyncTCP.git#v3.6.1
build_flags =
    -I include
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DIP_NAPT_TIMEOUT_MS_TCP=600000
    -DCORE_DEBUG_LEVEL=0
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
    -Wno-cpp
build_src_flags =
    -Wall
    -Wextra
    -Wcpp
    -Werror
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" -DCMAKE_PROJECT_tesla-fsd-controller-withtls_INCLUDE="idf_o2_compat.cmake"
extra_scripts = pre:compress_html.py, post:merge_firmware.py

[env:esp32-wifi-debug]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board = esp32dev
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
    https://github.com/ESP32Async/AsyncTCP.git#v3.6.1
build_flags =
    -I include
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DIP_NAPT_TIMEOUT_MS_TCP=600000
    -DDEBUG_MODE
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
    -Wno-cpp
build_src_flags =
    -Wall
    -Wextra
    -Wcpp
    -Werror
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" -DCMAKE_PROJECT_tesla-fsd-controller-withtls_INCLUDE="idf_o2_compat.cmake"
extra_scripts = pre:compress_html.py, post:merge_firmware.py

; ── Waveshare ESP32-S3 Wi-Fi 桥接 + DNS 过滤 + FSD 下发（TLS 1.3） ────────────
; 手机热点 → ESP32-S3 STA → ESP32-S3 AP → 车机
[env:esp32s3-waveshare-wifi]
; Arduino 4.0.0 / ESP-IDF 6.1.1: mbedTLS 4.0 (TF-PSA-Crypto) TLS 1.2 + TLS 1.3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
    https://github.com/ESP32Async/AsyncTCP.git#v3.6.1
build_flags =
    -I include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWIFI_BRIDGE_ENABLED
    -DIP_NAPT_TIMEOUT_MS_UDP=30000
    -DIP_NAPT_TIMEOUT_MS_TCP=600000
    -DCORE_DEBUG_LEVEL=0
    -DESP_IDF_LWIP_HOOK_FILENAME=\"lwip_hooks.h\"
    -Wno-error=return-type
    -Wno-cpp
build_src_flags =
    -Wall
    -Wextra
    -Wcpp
    -Werror
build_unflags = -Werror=return-type
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.tls13.defaults" -DCMAKE_PROJECT_tesla-fsd-controller-withtls_INCLUDE="idf_o2_compat.cmake"
extra_scripts = pre:compress_html.py, post:merge_firmware.py

